<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal · mi-sitio</title>
<style>
  :root{
    --fondo:#f2f5f3; --tarjeta:#ffffff; --texto:#1b2a24; --suave:#5c6b64;
    --verde:#1f6b52; --verde-osc:#165240; --borde:#d9e2dd; --error:#b3321f; --ok:#1f6b52;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.5}
  header{background:var(--verde);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:1.15rem;font-weight:600}
  main{max-width:640px;margin:24px auto;padding:0 16px}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:20px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:1.05rem}
  label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--suave)}
  input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--borde);border-radius:8px;background:#fff;color:var(--texto)}
  input:focus-visible,button:focus-visible{outline:3px solid #8fd0b8;outline-offset:1px}
  .fila{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer}
  button:hover{background:var(--verde-osc)}
  button:disabled{opacity:.6;cursor:wait}
  button.sec{background:#fff;color:var(--verde)}
  button.sec:hover{background:#eef5f1}
  header button{background:transparent;border-color:#fff;color:#fff}
  header button:hover{background:rgba(255,255,255,.15)}
  .full{width:100%}
  .msg{margin-top:12px;font-size:.92rem;min-height:1.2em}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--error)}
  ul{list-style:none;margin:0;padding:0}
  li{padding:10px 0;border-top:1px solid var(--borde)}
  li:first-child{border-top:0}
  li small{display:block;color:var(--suave)}
  .oculto{display:none}
  .vacio{color:var(--suave)}
  /* pestañas */
  .tabs{display:flex;border-bottom:1px solid var(--borde);margin:-20px -20px 8px}
  .tab{flex:1;background:transparent;color:var(--suave);border:0;border-bottom:3px solid transparent;border-radius:10px 10px 0 0;padding:14px 8px;font-weight:600}
  .tab:hover{background:#f6faf8}
  .tab[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde)}
  .pw{position:relative}
  .pw input{padding-right:84px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px 10px;font-size:.82rem}
  .ayuda{font-size:.82rem;color:var(--suave);margin-top:4px}
</style>
</head>
<body>

<header>
  <h1>Portal</h1>
  <div id="barra" class="oculto">
    <span id="quien"></span>
    <button onclick="salir()" style="margin-left:10px">Cerrar sesión</button>
  </div>
</header>

<main>

  <!-- Acceso (sin sesión) -->
  <section id="login" class="tarjeta">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-entrar" role="tab" aria-selected="true"  onclick="cambiarModo('entrar')">Iniciar sesión</button>
      <button class="tab" id="tab-registro" role="tab" aria-selected="false" onclick="cambiarModo('registro')">Crear cuenta</button>
    </div>

    <form id="form-acceso" onsubmit="enviarAcceso(event)" novalidate>
      <h2 id="titulo-acceso">Bienvenido de nuevo</h2>

      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" placeholder="alumno@ejemplo.com">

      <label for="pass">Contraseña</label>
      <div class="pw">
        <input id="pass" type="password" autocomplete="current-password">
        <button type="button" class="sec" id="ver1" onclick="verPass('pass','ver1')">Mostrar</button>
      </div>
      <div id="ayuda-pass" class="ayuda oculto">Mínimo 6 caracteres.</div>

      <div id="bloque-confirmar" class="oculto">
        <label for="pass2">Confirmar contraseña</label>
        <div class="pw">
          <input id="pass2" type="password" autocomplete="new-password">
          <button type="button" class="sec" id="ver2" onclick="verPass('pass2','ver2')">Mostrar</button>
        </div>
      </div>

      <div class="fila">
        <button type="submit" id="btn-enviar" class="full">Iniciar sesión</button>
      </div>
      <div id="m1" class="msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Panel (solo con sesión) -->
  <section id="app" class="oculto">
    <div class="tarjeta">
      <h2>Nueva solicitud</h2>
      <label for="titulo">Título</label>
      <input id="titulo" type="text" maxlength="120">
      <label for="monto">Monto</label>
      <input id="monto" type="number" min="0" step="0.01">
      <div class="fila"><button onclick="crearSolicitud()">Guardar solicitud</button></div>
      <div id="m2" class="msg" role="status" aria-live="polite"></div>
    </div>

    <div class="tarjeta">
      <h2>Solicitudes</h2>
      <ul id="lista"></ul>
    </div>
  </section>

</main>

<!-- Librería de Supabase y tu configuración (debe definir el cliente como "sb") -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
  // ---------- utilidades ----------
  function val(id){ return document.getElementById(id).value.trim(); }
  function msg(id, texto, ok){
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function traducir(error){
    const m = (error.message || '').toLowerCase();
    if (m.includes('already registered')) return 'Ese correo ya tiene una cuenta. Inicia sesión.';
    if (m.includes('at least') || m.includes('weak')) return 'La contraseña es muy débil (mínimo 6 caracteres).';
    if (m.includes('valid email') || m.includes('invalid')) return 'Escribe un correo válido.';
    if (m.includes('rate limit') || m.includes('too many')) return 'Demasiados intentos. Espera un momento e inténtalo de nuevo.';
    if (m.includes('fetch') || m.includes('network')) return 'Sin conexión con el servidor. Revisa tu internet.';
    return error.message;
  }

  // ---------- pestañas iniciar sesión / crear cuenta ----------
  let modo = 'entrar';
  function cambiarModo(nuevo){
    modo = nuevo;
    const reg = nuevo === 'registro';
    document.getElementById('tab-entrar').setAttribute('aria-selected', String(!reg));
    document.getElementById('tab-registro').setAttribute('aria-selected', String(reg));
    document.getElementById('titulo-acceso').textContent = reg ? 'Crea tu cuenta' : 'Bienvenido de nuevo';
    document.getElementById('btn-enviar').textContent = reg ? 'Crear cuenta' : 'Iniciar sesión';
    document.getElementById('bloque-confirmar').classList.toggle('oculto', !reg);
    document.getElementById('ayuda-pass').classList.toggle('oculto', !reg);
    document.getElementById('pass').autocomplete = reg ? 'new-password' : 'current-password';
    document.getElementById('pass2').value = '';
    msg('m1', '', true);
  }
  function verPass(inputId, btnId){
    const i = document.getElementById(inputId), b = document.getElementById(btnId);
    const ver = i.type === 'password';
    i.type = ver ? 'text' : 'password';
    b.textContent = ver ? 'Ocultar' : 'Mostrar';
  }
  async function enviarAcceso(e){
    e.preventDefault();               // permite enviar con Enter
    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    try { modo === 'registro' ? await registrar() : await entrar(); }
    finally { btn.disabled = false; }
  }

  // ---------- pantallas ----------
  async function mostrarApp(){
    const { data: { user } } = await sb.auth.getUser();
    document.getElementById('quien').textContent = user ? user.email : '';
    document.getElementById('login').classList.add('oculto');
    document.getElementById('app').classList.remove('oculto');
    document.getElementById('barra').classList.remove('oculto');
    cargarSolicitudes();
  }
  function mostrarLogin(){
    document.getElementById('app').classList.add('oculto');
    document.getElementById('barra').classList.add('oculto');
    document.getElementById('login').classList.remove('oculto');
    document.getElementById('pass').value = '';
    document.getElementById('pass2').value = '';
    document.getElementById('lista').innerHTML = '';
    cambiarModo('entrar');
  }

  // ---------- Supabase Auth ----------
  async function registrar(){
    const email = val('email'), password = document.getElementById('pass').value;
    if (!email) return msg('m1', 'Escribe tu correo.', false);
    if (password.length < 6) return msg('m1', 'La contraseña debe tener mínimo 6 caracteres.', false);
    if (password !== document.getElementById('pass2').value) return msg('m1', 'Las contraseñas no coinciden.', false);

    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return msg('m1', 'Error: ' + traducir(error), false);
    // Supabase no da error si el correo ya existe; devuelve un usuario sin identidades
    if (data.user && data.user.identities && data.user.identities.length === 0)
      return msg('m1', 'Ese correo ya tiene una cuenta. Inicia sesión.', false);

    cambiarModo('entrar');
    msg('m1', 'Cuenta creada. Ya puedes iniciar sesión.', true);
  }

  async function entrar(){
    const email = val('email'), password = document.getElementById('pass').value;
    if (!email || !password) return msg('m1', 'Escribe tu correo y contraseña.', false);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return msg('m1', 'Credenciales incorrectas', false);
    mostrarApp();
  }

  async function salir(){
    await sb.auth.signOut();
    mostrarLogin();
  }

  // ---------- solicitudes ----------
  async function crearSolicitud(){
    const titulo = val('titulo');
    const monto = parseFloat(val('monto'));
    if (!titulo || isNaN(monto)) return msg('m2', 'Escribe un título y un monto válido.', false);

    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from('solicitudes').insert({ titulo, monto, usuario_email: user.email });
    if (error) return msg('m2', 'No se pudo guardar: ' + error.message, false);

    document.getElementById('titulo').value = '';
    document.getElementById('monto').value = '';
    msg('m2', 'Solicitud guardada.', true);
    cargarSolicitudes();
  }

  async function cargarSolicitudes(){
    const ul = document.getElementById('lista');
    const { data, error } = await sb.from('solicitudes').select('*').order('id', { ascending: false });
    if (error){ ul.innerHTML = '<li class="vacio">No se pudieron cargar: ' + esc(error.message) + '</li>'; return; }
    if (!data.length){ ul.innerHTML = '<li class="vacio">Aún no hay solicitudes. Crea la primera arriba.</li>'; return; }
    ul.innerHTML = data.map(s =>
      '<li><strong>' + esc(s.titulo) + '</strong> · $' + esc(s.monto) +
      '<small>' + esc(s.usuario_email) + '</small></li>'
    ).join('');
  }

  // ---------- al cargar: si hay sesión, entra directo ----------
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) mostrarApp();
  })();
</script>
</body>
</html>
